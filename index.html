<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Daily Log</title>
<meta name="description" content="A daily diary — short entries, posted any time, from anywhere.">

<!-- Open Graph / social preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="My Daily Log">
<meta property="og:description" content="A daily diary — short entries, posted any time, from anywhere.">
<meta property="og:url" content="https://prazzhant.github.io/">

<!-- Canonical + crawl hints -->
<link rel="canonical" href="https://prazzhant.github.io/">
<meta name="robots" content="index, follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": "My Daily Log",
  "description": "A daily diary — short entries, posted any time, from anywhere.",
  "url": "https://prazzhant.github.io/"
}
</script>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div>
      <h1 class="site-title"><a href="./">My Daily Log</a></h1>
      <span class="site-sub">a running diary</span>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button">☾ Dark</button>
  </header>

  <main id="feed" aria-live="polite">
    <div class="empty-state">Loading entries…</div>
  </main>

  <footer class="site-footer">
    updated as it happens
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
